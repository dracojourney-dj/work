<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lingora — 沉浸式多语种学习平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23134E48'/%3E%3Ctext x='16' y='23' font-family='serif' font-size='18' font-weight='700' fill='%23D4A23B' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- App shell -->
  <div id="app">
    <header id="topbar" class="topbar" hidden>
      <div class="topbar-inner">
        <a class="brand" href="#/dashboard" data-link>
          <span class="brand-mark">L</span>
          <span class="brand-name">Lingora</span>
        </a>
        <nav class="nav" id="mainNav">
          <a href="#/dashboard" data-link data-nav="dashboard">学习中心</a>
          <a href="#/courses" data-link data-nav="courses">课程</a>
          <a href="#/progress" data-link data-nav="progress">进度</a>
          <a href="#/community" data-link data-nav="community">社区</a>
          <a href="#/achievements" data-link data-nav="achievements">成就</a>
        </nav>
        <div class="nav-right">
          <div class="streak-chip" id="streakChip" hidden>
            <span class="flame">🔥</span><span id="streakCount">0</span>
          </div>
          <div class="xp-chip" id="xpChip" hidden>
            <span class="xp-gem">◆</span><span id="xpCount">0</span>
          </div>
          <button class="avatar-btn" id="avatarBtn" hidden></button>
        </div>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <footer class="foot" id="foot" hidden>
      <div class="foot-inner">
        <span>© 2026 Lingora · 沉浸式语言学习</span>
        <span class="foot-tag">Learn. Speak. Belong.</span>
      </div>
    </footer>
  </div>

  <!-- Toast -->
  <div class="toast-stack" id="toastStack" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
