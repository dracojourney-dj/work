<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小太阳打卡 · 学习生活管理</title>
<style>
  /* ============================================================
     设计令牌 — Design Tokens
     4px 间距体系 / 类型阶梯 / 语义色 / 阴影层级
     ============================================================ */
  :root {
    /* 主色：太阳暖橙 */
    --sun-50:  #fffbeb;
    --sun-100: #fef3c7;
    --sun-200: #fde68a;
    --sun-300: #fcd34d;
    --sun-400: #fbbf24;
    --sun-500: #f59e0b;
    --sun-600: #d97706;
    --sun-700: #b45309;

    /* 辅色 */
    --sky-100:  #e0f2fe;
    --sky-400:  #38bdf8;
    --sky-500:  #0ea5e9;
    --pink-100: #fce7f3;
    --pink-400: #f472b6;
    --green-100: #dcfce7;
    --green-400: #4ade80;
    --green-500: #22c55e;
    --green-600: #16a34a;
    --violet-100: #ede9fe;
    --violet-400: #a78bfa;
    --orange-100: #ffedd5;
    --orange-400: #fb923c;
    --red-400: #f87171;

    /* 文字 */
    --ink:        #1c1917;
    --ink-body:   #44403c;
    --ink-soft:   #78716c;
    --ink-faint:  #a8a29e;
    --ink-invert: #ffffff;

    /* 背景 */
    --bg:       #fffdf5;
    --bg-soft:  #fefcf3;
    --card:     #ffffff;
    --card-alt: #fffbeb;

    /* 边框 */
    --border:       #f5e9c8;
    --border-soft:  #f9f2dd;
    --border-strong:#e8d99b;

    /* 阴影层级 */
    --shadow-xs:  0 1px 2px rgba(120, 113, 76, 0.06);
    --shadow-sm:  0 2px 8px rgba(120, 113, 76, 0.08);
    --shadow-md:  0 8px 24px rgba(245, 158, 11, 0.10);
    --shadow-lg:  0 16px 40px rgba(245, 158, 11, 0.16);
    --shadow-glow: 0 0 20px rgba(251, 191, 36, 0.35);

    /* 圆角 */
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --radius-xl: 28px;
    --radius-full: 999px;

    /* 间距 (4px 基准) */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 20px;
    --sp-6: 24px;
    --sp-8: 32px;
    --sp-10: 40px;

    /* 动效 */
    --ease-bounce: cubic-bezier(.34, 1.56, .64, 1);
    --ease-smooth: cubic-bezier(.4, 0, .2, 1);
    --dur-fast: 0.15s;
    --dur-mid: 0.25s;
    --dur-slow: 0.4s;

    /* 尺寸 */
    --touch-min: 44px;
    --header-h: 64px;
    --bottomnav-h: 68px;
  }

  /* ============================================================
     基础重置
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(900px 500px at 85% -8%, var(--sun-100), transparent 55%),
      radial-gradient(700px 400px at -5% 15%, var(--sky-100), transparent 50%),
      radial-gradient(500px 300px at 50% 100%, var(--pink-100), transparent 60%),
      var(--bg);
    min-height: 100vh;
  }

  /* 无障碍：focus-visible */
  :focus-visible {
    outline: 3px solid var(--sky-400);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
  }

  /* 全局选中取消（移动端长按） */
  .no-select {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ============================================================
     App 容器
     ============================================================ */
  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: var(--sp-4) var(--sp-4) calc(var(--bottomnav-h) + var(--sp-6));
    min-height: 100vh;
  }
  @media (min-width: 600px) {
    .app { padding-bottom: var(--sp-8); }
  }

  /* ============================================================
     顶部 Header
     ============================================================ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    background: linear-gradient(135deg, #fff8e1, var(--card-alt));
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--sp-3) var(--sp-4);
    box-shadow: var(--shadow-md);
    position: sticky;
    top: var(--sp-2);
    z-index: 20;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    min-width: 0;
  }
  .brand .logo {
    width: 48px; height: 48px;
    flex-shrink: 0;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--sun-300), var(--sun-500));
    border-radius: var(--radius-md);
    font-size: 28px;
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    animation: logoPulse 3s var(--ease-smooth) infinite;
  }
  @keyframes logoPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .brand .brand-text { min-width: 0; }
  .brand h1 {
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: 0.3px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand p {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 钱包 */
  .wallet {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    background: linear-gradient(135deg, #fff, var(--sun-50));
    border: 2px solid var(--sun-200);
    border-radius: var(--radius-full);
    padding: var(--sp-2) var(--sp-4) var(--sp-2) var(--sp-2);
    box-shadow: var(--shadow-sm);
    transition: transform var(--dur-mid) var(--ease-bounce);
  }
  .wallet.bump {
    animation: walletBump 0.5s var(--ease-bounce);
  border-color: var(--sun-400);
    box-shadow: var(--shadow-glow);
  }
  @keyframes walletBump {
    0% { transform: scale(1); }
    30% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .wallet .sun-icon {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    font-size: 26px;
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wallet .pts-num {
    font-weight: 900;
    font-size: 22px;
    color: var(--sun-600);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .wallet .pts-label {
    font-size: 10px;
    color: var(--ink-faint);
    font-weight: 600;
    align-self: flex-end;
    margin-bottom: 3px;
  }

  /* ============================================================
     用户选择栏
     ============================================================ */
  .users {
    display: flex;
    gap: var(--sp-2);
    margin: var(--sp-4) var(--sp-1) var(--sp-1);
    overflow-x: auto;
    padding: var(--sp-1) var(--sp-1) var(--sp-2);
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .users::-webkit-scrollbar { display: none; }

  .user-chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    background: var(--card);
    border: 2px solid transparent;
    border-radius: var(--radius-full);
    padding: var(--sp-1) var(--sp-3) var(--sp-1) var(--sp-1);
    cursor: pointer;
    transition: all var(--dur-mid) var(--ease-smooth);
    box-shadow: var(--shadow-xs);
    min-height: 48px;
  }
  .user-chip:active { transform: scale(0.96); }
  .user-chip.active {
    border-color: var(--sun-400);
    background: linear-gradient(135deg, var(--sun-50), #fff);
    box-shadow: 0 4px 16px rgba(245, 158, 11, 0.2);
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 22px;
    background: var(--sun-100);
    flex-shrink: 0;
  }
  .user-chip .uname {
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    white-space: nowrap;
  }
  .user-chip .upoints {
    font-size: 11px;
    color: var(--sun-600);
    background: var(--sun-100);
    padding: 2px var(--sp-2);
    border-radius: var(--radius-full);
    font-weight: 800;
    white-space: nowrap;
  }
  .user-chip.active .upoints {
    background: var(--sun-200);
  }
  .add-user {
    flex: 0 0 auto;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2.5px dashed var(--sun-300);
    background: var(--card);
    color: var(--sun-500);
    font-size: 24px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: all var(--dur-mid) var(--ease-smooth);
  }
  .add-user:hover { background: var(--sun-50); }
  .add-user:active { transform: scale(0.92) rotate(90deg); }

  /* ============================================================
     底部导航栏（移动优先）
     ============================================================ */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 30;
    display: flex;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1.5px solid var(--border);
    padding: var(--sp-1) var(--sp-2) calc(var(--sp-1) + env(safe-area-inset-bottom, 0px));
    max-width: 720px;
    margin: 0 auto;
  }
  @media (min-width: 600px) {
    .bottom-nav {
      position: sticky;
      top: calc(var(--header-h) + var(--sp-4));
      bottom: auto;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-full);
      margin: var(--sp-4) auto var(--sp-4);
      padding: var(--sp-1);
      box-shadow: var(--shadow-sm);
    }
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: var(--sp-2) var(--sp-1);
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--ink-faint);
    font-size: 11px;
    font-weight: 700;
    border-radius: var(--radius-full);
    transition: all var(--dur-mid) var(--ease-smooth);
    min-height: var(--touch-min);
    position: relative;
  }
  .nav-item .nav-emoji { font-size: 22px; line-height: 1; }
  .nav-item.active {
    color: var(--sun-600);
    background: linear-gradient(135deg, var(--sun-100), var(--sun-50));
  }
  .nav-item.active .nav-emoji { transform: scale(1.1); }
  .nav-item:active { transform: scale(0.94); }

  /* 桌面端导航文字 */
  @media (max-width: 599px) {
    .nav-item { font-size: 10px; }
  }

  /* ============================================================
     面板切换动画
     ============================================================ */
  .panel { animation: panelIn var(--dur-mid) var(--ease-smooth); }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============================================================
     今日概览栏 — 环形进度 + 连续天数
     ============================================================ */
  .today-hero {
    display: flex;
    align-items: center;
    gap: var(--sp-4);
    background: linear-gradient(135deg, var(--sun-100), #fff 70%);
    border: 1.5px solid var(--sun-200);
    border-radius: var(--radius-lg);
    padding: var(--sp-4);
    margin-bottom: var(--sp-5);
    box-shadow: var(--shadow-sm);
  }

  .ring-wrap {
    position: relative;
    width: 80px; height: 80px;
    flex-shrink: 0;
  }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-wrap .ring-bg {
    fill: none;
    stroke: rgba(245, 158, 11, 0.15);
    stroke-width: 8;
  }
  .ring-wrap .ring-fg {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset var(--dur-slow) var(--ease-bounce);
  }
  .ring-wrap .ring-center {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    line-height: 1;
  }
  .ring-wrap .ring-center .rc-num {
    font-size: 22px;
    font-weight: 900;
    color: var(--sun-600);
    font-variant-numeric: tabular-nums;
  }
  .ring-wrap .ring-center .rc-lbl {
    font-size: 9px;
    color: var(--ink-faint);
    font-weight: 600;
    margin-top: 2px;
  }

  .today-info { flex: 1; min-width: 0; }
  .today-info .ti-date {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: var(--sp-1);
  }
  .today-info .ti-pts {
    display: flex;
    align-items: baseline;
    gap: var(--sp-1);
  }
  .today-info .ti-pts .big {
    font-size: 28px;
    font-weight: 900;
    color: var(--sun-600);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .today-info .ti-pts .unit { font-size: 16px; }
  .today-info .ti-sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: var(--sp-1);
  }
  .streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: var(--orange-100);
    color: var(--orange-400);
    padding: 2px var(--sp-2);
    border-radius: var(--radius-full);
    font-size: 11px;
    font-weight: 800;
    margin-top: var(--sp-1);
  }

  /* ============================================================
     区块标题
     ============================================================ */
  .sec-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: var(--sp-1) var(--sp-1) var(--sp-4);
  }
  .sec-head h2 {
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }
  .sec-head .sub {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  /* ============================================================
     卡片网格
     ============================================================ */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--sp-3);
  }
  @media (min-width: 480px) {
    .grid { gap: var(--sp-4); }
  }
  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: var(--sp-4);
    box-shadow: var(--shadow-xs);
    transition: transform var(--dur-fast) var(--ease-smooth),
                box-shadow var(--dur-mid) var(--ease-smooth),
                border-color var(--dur-mid) var(--ease-smooth);
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    position: relative;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .card:active {
    transform: scale(0.97);
  }

  /* 任务卡 */
  .task-card .tc-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sp-2);
  }
  .task-card .ticon {
    width: 48px; height: 48px;
    border-radius: var(--radius-md);
    display: grid; place-items: center;
    font-size: 26px;
    background: var(--sun-50);
    flex-shrink: 0;
    transition: background var(--dur-mid) var(--ease-smooth);
  }
  .task-card .pts-badge {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: var(--sun-100);
    color: var(--sun-600);
    font-size: 12px;
    font-weight: 800;
    padding: 3px var(--sp-2);
    border-radius: var(--radius-full);
    flex-shrink: 0;
  }
  .task-card .ttitle {
    font-weight: 700;
    font-size: 14px;
    line-height: 1.35;
    color: var(--ink);
  }
  .task-card .check-btn {
    margin-top: auto;
    width: 100%;
    border: none;
    border-radius: var(--radius-sm);
    padding: var(--sp-3) var(--sp-2);
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: all var(--dur-fast) var(--ease-smooth);
    background: var(--sun-100);
    color: var(--sun-600);
    min-height: var(--touch-min);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-1);
  }
  .task-card .check-btn:active { transform: scale(0.95); }
  .task-card .check-btn:hover { background: var(--sun-200); }

  /* 完成态 */
  .task-card.done {
    border-color: var(--green-400);
    background: linear-gradient(180deg, #fff, #f0fdf4);
  }
  .task-card.done .ticon {
    background: var(--green-100);
    animation: bouncePop 0.5s var(--ease-bounce);
  }
  @keyframes bouncePop {
    0% { transform: scale(0.6); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  .task-card.done .check-btn {
    background: var(--green-500);
    color: #fff;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
  }
  .task-card.done .pts-badge {
    background: var(--green-100);
    color: var(--green-600);
  }
  .task-card.done::after {
    content: '✓';
    position: absolute;
    top: var(--sp-2);
    right: var(--sp-2);
    width: 24px; height: 24px;
    background: var(--green-500);
    color: #fff;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 14px;
    font-weight: 900;
    box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
    animation: checkPop 0.4s var(--ease-bounce);
  }
  @keyframes checkPop {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* 飘浮太阳 */
  .float-sun {
    position: fixed;
    font-size: 32px;
    pointer-events: none;
    z-index: 100;
    animation: floatUp 1.2s var(--ease-bounce) forwards;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 0; }
    15%  { transform: translateY(-8px) scale(1.3) rotate(20deg); opacity: 1; }
    100% { transform: translateY(-90px) scale(0.9) rotate(-15deg); opacity: 0; }
  }

  /* ============================================================
     兑换卡
     ============================================================ */
  .reward-card .rc-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sp-2);
  }
  .reward-card .ricon {
    width: 52px; height: 52px;
    border-radius: var(--radius-md);
    display: grid; place-items: center;
    font-size: 28px;
    background: var(--violet-100);
    flex-shrink: 0;
  }
  .reward-card .rtitle {
    font-weight: 700;
    font-size: 14px;
    line-height: 1.35;
    color: var(--ink);
  }
  .reward-card .rcost {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-weight: 800;
    color: var(--sun-600);
    font-size: 14px;
  }
  .reward-card .redeem-btn {
    margin-top: auto;
    width: 100%;
    border: none;
    border-radius: var(--radius-sm);
    padding: var(--sp-3) var(--sp-2);
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--violet-400), var(--pink-400));
    color: #fff;
    transition: all var(--dur-fast) var(--ease-smooth);
    min-height: var(--touch-min);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-1);
  }
  .reward-card .redeem-btn:active { transform: scale(0.95); }
  .reward-card .redeem-btn:hover {
    box-shadow: 0 6px 16px rgba(167, 139, 250, 0.35);
  }
  .reward-card.affordable {
    border-color: var(--sun-200);
    box-shadow: 0 4px 16px rgba(251, 191, 36, 0.12);
  }
  .reward-card.affordable .ricon {
    background: var(--sun-50);
  }
  .reward-card .redeem-btn:disabled {
    background: #f1f0ec;
    color: var(--ink-faint);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .reward-card:not(.affordable) {
    opacity: 0.85;
  }
  .reward-card:not(.affordable) .ricon {
    filter: grayscale(0.3);
    opacity: 0.7;
  }

  /* ============================================================
     管理后台

<script>
/* ============================================================
   小太阳打卡系统 - 数据层
   ============================================================ */
const STORAGE_KEY = 'xiaotaiyang_data_v2';

const DEFAULT_TASKS = [
  { id: 't1', icon: '📚', title: '阅读 30 分钟', points: 10 },
  { id: 't2', icon: '✏️', title: '完成作业', points: 15 },
  { id: 't3', icon: '🧹', title: '整理房间', points: 8 },
  { id: 't4', icon: '🥦', title: '好好吃饭不挑食', points: 5 },
  { id: 't5', icon: '🛏️', title: '按时睡觉', points: 8 },
  { id: 't6', icon: '🏃', title: '运动 30 分钟', points: 10 },
  { id: 't7', icon: '🎹', title: '练琴 / 练习兴趣', points: 12 },
  { id: 't8', icon: '🪥', title: '刷牙洗脸', points: 3 },
];

const DEFAULT_REWARDS = [
  { id: 'r1', icon: '📺', title: '看动画片 30 分钟', cost: 30 },
  { id: 'r2', icon: '🍦', title: '吃一个冰淇淋', cost: 20 },
  { id: 'r3', icon: '🎮', title: '玩游戏 20 分钟', cost: 25 },
  { id: 'r4', icon: '📖', title: '买一本新书', cost: 80 },
  { id: 'r5', icon: '🎡', title: '周末去游乐园', cost: 200 },
  { id: 'r6', icon: '🍔', title: '吃一次汉堡套餐', cost: 50 },
];

const DEFAULT_USERS = [
  { id: 'u1', name: '小明', avatar: '👦', points: 0 },
];

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      // 从 v1 迁移
      if (d && d.users) return d;
    }
  } catch(e) {}
  // 尝试迁移 v1 数据
  try {
    const old = localStorage.getItem('xiaotaiyang_data_v1');
    if (old) {
      const d = JSON.parse(old);
      if (d && d.users) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
        return d;
      }
    }
  } catch(e) {}
  return null;
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadData();
if (!state) {
  state = {
    users: DEFAULT_USERS,
    currentUserId: 'u1',
    tasks: DEFAULT_TASKS,
    rewards: DEFAULT_REWARDS,
    checkins: {},
    redemptions: [],
    lastActiveDate: {},
  };
  saveData();
}

state.users = state.users || DEFAULT_USERS;
state.tasks = state.tasks || DEFAULT_TASKS;
state.rewards = state.rewards || DEFAULT_REWARDS;
state.checkins = state.checkins || {};
state.redemptions = state.redemptions || [];
state.lastActiveDate = state.lastActiveDate || {};
if (!state.currentUserId && state.users[0]) state.currentUserId = state.users[0].id;

/* ============================================================
   工具函数
   ============================================================ */
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function yesterdayKey() {
  const d = new Date(); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return `${dt.getMonth()+1}月${dt.getDate()}日`;
}
function uid(prefix='id') {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function currentUser() {
  return state.users.find(u => u.id === state.currentUserId) || state.users[0];
}
function addPoints(userId, delta) {
  const u = state.users.find(x => x.id === userId);
  if (u) { u.points = Math.max(0, (u.points||0) + delta); }
}
function todayCheckins(userId) {
  const key = `${userId}_${todayKey()}`;
  return state.checkins[key] || {};
}

/* 连续打卡天数 */
function calcStreak(userId) {
  let streak = 0;
  let dayKey = todayKey();
  // 如果今天有打卡，从今天开始；否则从昨天开始
  const todayDone = Object.keys(todayCheckins(userId)).length > 0;
  if (!todayDone) {
    const d = new Date(); d.setDate(d.getDate()-1);
    dayKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  while (true) {
    const ck = state.checkins[`${userId}_${dayKey}`];
    if (ck && Object.keys(ck).length > 0) {
      streak++;
      const d = new Date(dayKey + 'T00:00:00'); d.setDate(d.getDate()-1);
      dayKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    } else break;
    if (streak > 365) break;
  }
  return streak;
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
  renderUsersBar();
  renderWallet();
  renderTasks();
  renderRewards();
  renderAdmin();
  renderDate();
}

function renderDate() {
  const d = new Date();
  const wd = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('todayDate').textContent = `${d.getMonth()+1}月${d.getDate()}日 星期${wd}`;
  const hr = d.getHours();
  const greet = hr < 6 ? '夜深了' : hr < 12 ? '早上好' : hr < 14 ? '中午好' : hr < 18 ? '下午好' : '晚上好';
  const u = currentUser();
  document.getElementById('dateLabel').textContent = `${greet}，${u?u.name:'小朋友'}！`;
}

function renderWallet() {
  const u = currentUser();
  const el = document.getElementById('walletPts');
  const wallet = document.getElementById('wallet');
  el.textContent = u ? u.points : 0;
}

function bumpWallet() {
  const wallet = document.getElementById('wallet');
  wallet.classList.remove('bump');
  void wallet.offsetWidth;
  wallet.classList.add('bump');
  setTimeout(() => wallet.classList.remove('bump'), 600);
}

function renderUsersBar() {
  const bar = document.getElementById('usersBar');
  bar.innerHTML = '';
  state.users.forEach(u => {
    const chip = document.createElement('button');
    chip.className = 'user-chip' + (u.id === state.currentUserId ? ' active' : '');
    chip.setAttribute('role', 'tab');
    chip.setAttribute('aria-selected', u.id === state.currentUserId);
    chip.innerHTML = `
      <div class="avatar" style="background:${avatarBg(u.avatar)}">${u.avatar}</div>
      <span class="uname">${u.name}</span>
      <span class="upoints">${u.points}☀️</span>
    `;
    chip.onclick = () => { state.currentUserId = u.id; saveData(); render(); };
    bar.appendChild(chip);
  });
  const add = document.createElement('button');
  add.className = 'add-user';
  add.textContent = '+';
  add.title = '添加孩子';
  add.setAttribute('aria-label', '添加孩子');
  add.onclick = openAddUser;
  bar.appendChild(add);
}

function avatarBg(emoji) {
  const bgs = ['var(--sun-100)','var(--sky-100)','var(--pink-100)','var(--green-100)','var(--violet-100)','var(--orange-100)'];
  let h = 0;
  for (let i=0;i<emoji.length;i++) h = (h*31 + emoji.charCodeAt(i)) >>> 0;
  return bgs[h % bgs.length];
}

function renderTasks() {
  const grid = document.getElementById('tasksGrid');
  grid.innerHTML = '';
  const u = currentUser();
  if (!u) { grid.innerHTML = emptyHtml('还没有用户', '👶', '点击上方 + 添加孩子'); return; }
  if (state.tasks.length === 0) { grid.innerHTML = emptyHtml('还没有任务', '📋', '去管理后台添加吧'); return; }

  const done = todayCheckins(u.id);
  let todayTotal = 0, doneCount = 0, totalPossible = 0;
  state.tasks.forEach(t => {
    totalPossible += t.points;
    const isDone = !!done[t.id];
    if (isDone) { todayTotal += t.points; doneCount++; }
    const card = document.createElement('div');
    card.className = 'card task-card' + (isDone ? ' done' : '');
    card.innerHTML = `
      <div class="tc-top">
        <div class="ticon">${t.icon}</div>
        <div class="pts-badge">☀️ ${t.points}</div>
      </div>
      <div class="ttitle">${t.title}</div>
      <button class="check-btn" aria-label="${isDone ? '取消打卡' : '完成' + t.title}">
        ${isDone ? '✓ 已完成' : '打卡'}
      </button>
    `;
    card.querySelector('.check-btn').onclick = () => toggleTask(t, card);
    grid.appendChild(card);
  });

  // 更新环形进度
  document.getElementById('todayPts').textContent = todayTotal;
  document.getElementById('doneCount').textContent = `${doneCount}/${state.tasks.length}`;
  document.getElementById('todayTotalLbl').textContent = `全部完成可获 ${totalPossible} ☀️`;
  const pct = state.tasks.length ? Math.round(doneCount / state.tasks.length * 100) : 0;
  const circ = 2 * Math.PI * 34; // 213.6
  const offset = circ * (1 - pct / 100);
  const ring = document.getElementById('ringFg');
  ring.setAttribute('stroke-dashoffset', offset);
  document.getElementById('ringPct').textContent = pct + '%';

  // 连续天数
  const streak = calcStreak(u.id);
  const sb = document.getElementById('streakBadge');
  if (streak >= 2) {
    sb.style.display = '';
    document.getElementById('streakDays').textContent = streak;
  } else {
    sb.style.display = 'none';
  }
}

function renderRewards() {
  const grid = document.getElementById('rewardsGrid');
  grid.innerHTML = '';
  const u = currentUser();
  if (!u) { grid.innerHTML = emptyHtml('还没有用户', '👶', '点击上方 + 添加孩子'); return; }
  if (state.rewards.length === 0) { grid.innerHTML = emptyHtml('还没有兑换项目', '🎁', '去管理后台添加吧'); return; }

  state.rewards.forEach(r => {
    const canAfford = u.points >= r.cost;
    const card = document.createElement('div');
    card.className = 'card reward-card' + (canAfford ? ' affordable' : '');
    card.innerHTML = `
      <div class="rc-top">
        <div class="ricon">${r.icon}</div>
      </div>
      <div class="rtitle">${r.title}</div>
      <div class="rcost">☀️ ${r.cost}</div>
      <button class="redeem-btn" ${canAfford ? '' : 'disabled'} aria-label="兑换${r.title}">
        ${canAfford ? '兑换' : '还差 ' + (r.cost - u.points)}
      </button>
    `;
    if (canAfford) {
      card.querySelector('.redeem-btn').onclick = () => redeemReward(r);
    }
    grid.appendChild(card);
  });

  // 兑换记录
  const hist = document.getElementById('historyList');
  const mine = state.redemptions.filter(x => x.userId === u.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0, 20);
  if (mine.length === 0) {
    hist.innerHTML = '<div class="empty" style="padding:var(--sp-6)"><div class="emoji">🗒️</div>还没有兑换记录<div class="empty-hint">多攒些太阳来换奖励吧！</div></div>';
  } else {
    hist.innerHTML = mine.map(h => `
      <div class="h-item">
        <div class="h-left">
          <span style="font-size:20px">${h.icon}</span>
          <span style="font-weight:700;color:var(--ink)">${h.rewardTitle}</span>
        </div>
        <div style="text-align:right">
          <div style="color:var(--sun-600);font-weight:800">-${h.cost} ☀️</div>
          <div class="h-date">${formatDate(h.date)}</div>
        </div>
      </div>
    `).join('');
  }
}

function renderAdmin() {
  const tl = document.getElementById('adminTasksList');
  tl.innerHTML = state.tasks.map(t => `
    <div class="admin-item">
      <div class="ai-icon">${t.icon}</div>
      <div class="ai-name">${t.title}<div class="ai-meta">${t.points} ☀️</div></div>
      <div class="ai-actions">
        <button class="icon-btn edit" onclick="editTask('${t.id}')" title="编辑" aria-label="编辑${t.title}">✏️</button>
        <button class="icon-btn danger" onclick="deleteTask('${t.id}')" title="删除" aria-label="删除${t.title}">🗑️</button>
      </div>
    </div>
  `).join('') || emptyHtmlInline('暂无任务');

  const rl = document.getElementById('adminRewardsList');
  rl.innerHTML = state.rewards.map(r => `
    <div class="admin-item">
      <div class="ai-icon">${r.icon}</div>
      <div class="ai-name">${r.title}<div class="ai-meta">${r.cost} ☀️</div></div>
      <div class="ai-actions">
        <button class="icon-btn edit" onclick="editReward('${r.id}')" title="编辑" aria-label="编辑${r.title}">✏️</button>
        <button class="icon-btn danger" onclick="deleteReward('${r.id}')" title="删除" aria-label="删除${r.title}">🗑️</button>
      </div>
    </div>
  `).join('') || emptyHtmlInline('暂无兑换项目');

  const ul = document.getElementById('adminUsersList');
  ul.innerHTML = state.users.map(u => `
    <div class="admin-item">
      <div class="ai-icon">${u.avatar}</div>
      <div class="ai-name">${u.name}<div class="ai-meta">${u.points} ☀️</div></div>
      <div class="ai-actions">
        <button class="icon-btn edit" onclick="editUser('${u.id}')" title="编辑" aria-label="编辑${u.name}">✏️</button>
        ${state.users.length > 1 ? `<button class="icon-btn danger" onclick="deleteUser('${u.id}')" title="删除" aria-label="删除${u.name}">🗑️</button>` : ''}
      </div>
    </div>
  `).join('') || emptyHtmlInline('暂无用户');
}

function emptyHtml(msg, emoji, hint) {
  return `<div class="empty fade-in"><div class="emoji">${emoji}</div>${msg}${hint ? `<div class="empty-hint">${hint}</div>` : ''}</div>`;
}
function emptyHtmlInline(msg) {
  return `<div class="empty" style="padding:var(--sp-4)">${msg}</div>`;
}

/* ============================================================
   交互：打卡 / 兑换
   ============================================================ */
function toggleTask(task, cardEl) {
  const u = currentUser();
  const key = `${u.id}_${todayKey()}`;
  if (!state.checkins[key]) state.checkins[key] = {};
  const done = state.checkins[key];
  if (done[task.id]) {
    delete done[task.id];
    addPoints(u.id, -task.points);
    toast(`已取消「${task.title}」`);
  } else {
    done[task.id] = true;
    addPoints(u.id, task.points);
    spawnFloatingSun(cardEl);
    bumpWallet();
    toast(`太棒了！+${task.points} ☀️`);
  }
  saveData();
  render();
}

function redeemReward(reward) {
  const u = currentUser();
  if (u.points < reward.cost) { toast('太阳不够哦，继续加油！'); return; }
  addPoints(u.id, -reward.cost);
  state.redemptions.push({
    id: uid('red'),
    userId: u.id,
    rewardId: reward.id,
    rewardTitle: reward.title,
    icon: reward.icon,
    cost: reward.cost,
    date: todayKey()
  });
  saveData();
  confetti();
  toast(`兑换成功！${reward.icon} ${reward.title}`);
  render();
}

/* ============================================================
   管理：任务 / 奖励 / 用户
   ============================================================ */
function addTask() {
  const icon = document.getElementById('newTaskIcon').value.trim() || '🌟';
  const title = document.getElementById('newTaskTitle').value.trim();
  const pts = parseInt(document.getElementById('newTaskPts').value) || 5;
  if (!title) { toast('请填写任务名称'); return; }
  state.tasks.push({ id: uid('t'), icon, title, points: pts });
  saveData(); render();
  document.getElementById('newTaskIcon').value='';
  document.getElementById('newTaskTitle').value='';
  document.getElementById('newTaskPts').value='';
  toast('任务已添加');
}

let editingTaskId = null;
function editTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  editingTaskId = id;
  document.getElementById('editTaskIcon').value = t.icon;
  document.getElementById('editTaskTitle').value = t.title;
  document.getElementById('editTaskPts').value = t.points;
  openModal('taskModal');
}
function saveTaskEdit() {
  const t = state.tasks.find(x => x.id === editingTaskId);
  if (!t) return;
  t.icon = document.getElementById('editTaskIcon').value.trim() || '🌟';
  t.title = document.getElementById('editTaskTitle').value.trim() || t.title;
  t.points = parseInt(document.getElementById('editTaskPts').value) || t.points;
  saveData(); render(); closeModal('taskModal');
  toast('已保存');
}
function deleteTask(id) {
  if (!confirm('确定删除这个任务吗？')) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  saveData(); render();
}

function addReward() {
  const icon = document.getElementById('newRewardIcon').value.trim() || '🎁';
  const title = document.getElementById('newRewardTitle').value.trim();
  const cost = parseInt(document.getElementById('newRewardCost').value) || 10;
  if (!title) { toast('请填写奖励名称'); return; }
  state.rewards.push({ id: uid('r'), icon, title, cost });
  saveData(); render();
  document.getElementById('newRewardIcon').value='';
  document.getElementById('newRewardTitle').value='';
  document.getElementById('newRewardCost').value='';
  toast('兑换项目已添加');
}

let editingRewardId = null;
function editReward(id) {
  const r = state.rewards.find(x => x.id === id);
  if (!r) return;
  editingRewardId = id;
  document.getElementById('editRewardIcon').value = r.icon;
  document.getElementById('editRewardTitle').value = r.title;
  document.getElementById('editRewardCost').value = r.cost;
  openModal('rewardModal');
}
function saveRewardEdit() {
  const r = state.rewards.find(x => x.id === editingRewardId);
  if (!r) return;
  r.icon = document.getElementById('editRewardIcon').value.trim() || '🎁';
  r.title = document.getElementById('editRewardTitle').value.trim() || r.title;
  r.cost = parseInt(document.getElementById('editRewardCost').value) || r.cost;
  saveData(); render(); closeModal('rewardModal');
  toast('已保存');
}
function deleteReward(id) {
  if (!confirm('确定删除这个兑换项目吗？')) return;
  state.rewards = state.rewards.filter(x => x.id !== id);
  saveData(); render();
}

function openAddUser() {
  const name = prompt('请输入孩子昵称：');
  if (!name || !name.trim()) return;
  const avatars = ['👦','👧','🧒','👶','🐻','🐰','🐱','🐶','🦊','🐼'];
  const avatar = avatars[Math.floor(Math.random()*avatars.length)];
  const u = { id: uid('u'), name: name.trim(), avatar, points: 0 };
  state.users.push(u);
  state.currentUserId = u.id;
  saveData(); render();
}

function editUser(id) {
  const u = state.users.find(x => x.id === id);
  if (!u) return;
  const name = prompt('修改昵称：', u.name);
  if (name && name.trim()) { u.name = name.trim(); saveData(); render(); }
}

function deleteUser(id) {
  if (state.users.length <= 1) { toast('至少保留一个用户'); return; }
  if (!confirm('确定删除这个用户吗？该用户的太阳和记录不会删除。')) return;
  state.users = state.users.filter(x => x.id !== id);
  if (state.currentUserId === id) state.currentUserId = state.users[0].id;
  saveData(); render();
}

/* ============================================================
   动效 & Toast
   ============================================================ */
function spawnFloatingSun(cardEl) {
  const rect = cardEl.getBoundingClientRect();
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const sun = document.createElement('div');
      sun.className = 'float-sun';
      sun.textContent = '☀️';
      sun.style.left = (rect.left + rect.width/2 - 16 + (Math.random()-0.5)*30) + 'px';
      sun.style.top = (rect.top + rect.height/2 - 10) + 'px';
      document.body.appendChild(sun);
      setTimeout(() => sun.remove(), 1300);
    }, i * 120);
  }
}

function confetti() {
  const colors = ['#fbbf24','#f472b6','#4ade80','#38bdf8','#a78bfa','#fb923c'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.5 + Math.random()*1.2) + 's';
    c.style.animationDelay = (Math.random()*0.4) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    c.style.width = (6 + Math.random()*8) + 'px';
    c.style.height = (8 + Math.random()*10) + 'px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ============================================================
   Modal & Tab
   ============================================================ */
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

document.querySelectorAll('.nav-item').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.nav-item').forEach(t => {
      t.classList.remove('active');
      t.setAttribute('aria-selected', 'false');
    });
    tab.classList.add('active');
    tab.setAttribute('aria-selected', 'true');
    const name = tab.dataset.tab;
    ['checkin','reward','admin'].forEach(p => {
      const el = document.getElementById('panel-'+p);
      el.style.display = (p===name ? '' : 'none');
    });
  };
});

document.querySelectorAll('.modal-mask').forEach(m => {
  m.onclick = (e) => { if (e.target === m) m.classList.remove('show'); };
});

// ESC 关闭弹窗
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-mask.show').forEach(m => m.classList.remove('show'));
  }
});

/* 启动 */
render();
</script>
</body>
</html>
